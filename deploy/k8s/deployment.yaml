apiVersion: apps/v1
kind: Deployment
metadata:
  name: blasta
  labels: {app.kubernetes.io/name: blasta}
spec:
  # One replica on purpose: a run lives in one process, so extra replicas would
  # not share runs or history and the UI would flip between them.
  replicas: 1
  # The history volume is ReadWriteOnce, so the old pod must stop before the new
  # one starts. A rolling update would deadlock on the volume.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: blasta}
  template:
    metadata:
      labels: {app.kubernetes.io/name: blasta}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      # Give a running test time to stop and save before the pod is killed.
      terminationGracePeriodSeconds: 20
      containers:
        - name: blasta
          image: blasta:latest
          imagePullPolicy: IfNotPresent
          args: ["serve", "--addr", "0.0.0.0:8080", "--allow-remote"]
          env:
            - {name: BLASTA_DATA_DIR, value: /data}
            # Sign-in is on. Put the public https address here (it is used for SSO
            # redirects), and SSO / setup-token settings in the blasta-env Secret:
            # see docs/AUTH.md.
            - {name: BLASTA_AUTH, value: "true"}
            - {name: BLASTA_PUBLIC_URL, value: "https://blasta.example.com"}
            - {name: BLASTA_REGISTRATION, value: "approval"}
          envFrom:
            # Database jobs read their DSN from an env var *name* set in the UI.
            # Put the values in a Secret named blasta-env (optional).
            - secretRef: {name: blasta-env, optional: true}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            # Load generation is CPU bound. Raise the CPU limit for higher
            # request rates; memory stays flat by design.
            limits: {cpu: "2", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: blasta-data}
